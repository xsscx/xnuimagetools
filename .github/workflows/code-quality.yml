name: code-quality

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Python and shell
        run: |
          set -euo pipefail
          python3 -m unittest contrib/scripts/test_validate_generated_images.py
          python3 -m compileall -q contrib/scripts
          bash -n .github/scripts/*.sh
      - name: Validate text encoding
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            encoding=$(file --brief --mime-encoding "$path")
            case "$encoding" in
              us-ascii|utf-8) ;;
              *) echo "Unexpected text encoding: $path ($encoding)" >&2; exit 1 ;;
            esac
          done < <(find . -type f \( -name '*.md' -o -name '*.py' -o -name '*.sh' -o -name '*.swift' -o -name '*.yml' \) -print0)
