name: release

permissions:
  contents: read

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release-artifacts:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and validate
        run: |
          set -euo pipefail
          XNU_IMAGE_DERIVED_DATA="$RUNNER_TEMP/DerivedData" \
            .github/scripts/generate-clean-images.sh "$RUNNER_TEMP/generated-images" both
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release-maccatalyst/XNU Image Generator for iOS.app" \
            "$RUNNER_TEMP/xnu-image-generator-maccatalyst.zip"
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/generated-images" \
            "$RUNNER_TEMP/clean-image-qa-corpus.zip"
          shasum -a 256 "$RUNNER_TEMP"/*.zip > "$RUNNER_TEMP/SHA256SUMS.txt"
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xnuimagetools-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/xnu-image-generator-maccatalyst.zip
            ${{ runner.temp }}/clean-image-qa-corpus.zip
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
