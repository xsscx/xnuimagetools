###############################################################
#
# Intent: xnuimagetools-release
#
# Create a GitHub Release with build artifacts when a version
# tag is pushed (v*). Also supports manual dispatch.
#
# Artifacts included:
#   - XNU Image Fuzzer app bundle (iOS Simulator, zipped)
#   - XNU Image Generator for iOS app bundle (zipped)
#   - Fuzzed image corpus (sample test images)
#   - Build metadata (Xcode version, checksums)
#
# Security hardening:
#   - Pinned action SHAs
#   - Least-privilege permissions
#   - persist-credentials: false
#   - BASH_ENV=/dev/null
#   - No user-controllable inputs in run: blocks
#
###############################################################

name: xnuimagetools-release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BASH_ENV: /dev/null
  DESTINATION: "generic/platform=iOS Simulator"

defaults:
  run:
    shell: bash --noprofile --norc {0}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0). Leave empty to use latest commit.'
        required: false
        type: string

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Determine version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Building release: ${VERSION}"

      - name: Show Xcode version
        id: xcode
        run: |
          set -euo pipefail
          XCODE_VERSION=$(xcodebuild -version 2>&1 | sed -n '1p')
          echo "xcode_version=${XCODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "${XCODE_VERSION}"

      # --- XNU Image Fuzzer ---
      - name: Build XNU Image Fuzzer (Release)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "XNU Image Fuzzer/XNU Image Fuzzer.xcodeproj" \
            -scheme "XNU Image Fuzzer" \
            -destination "$DESTINATION" \
            -configuration Release \
            -derivedDataPath /tmp/DerivedData-Fuzzer \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee /tmp/xcodebuild-fuzzer.log
          echo "✅ XNU Image Fuzzer Release build succeeded"

      - name: Package XNU Image Fuzzer
        id: fuzzer
        run: |
          set -euo pipefail
          BUILD_DIR=$(xcodebuild \
            -project "XNU Image Fuzzer/XNU Image Fuzzer.xcodeproj" \
            -scheme "XNU Image Fuzzer" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath /tmp/DerivedData-Fuzzer \
            -showBuildSettings \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>/dev/null | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')

          APP_PATH="$BUILD_DIR/XNU Image Fuzzer.app"
          if [ -d "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r /tmp/XNUImageFuzzer-Simulator.zip "XNU Image Fuzzer.app"
            echo "✅ Packaged: XNUImageFuzzer-Simulator.zip"
            ls -lh /tmp/XNUImageFuzzer-Simulator.zip
            echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "❌ XNU Image Fuzzer.app not found"
            exit 1
          fi

      # --- XNU Image Generator for iOS ---
      - name: Build XNU Image Generator for iOS (Release)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "XNU Image Generator for iOS/XNU Image Generator for iOS.xcodeproj" \
            -scheme "XNU Image Generator for iOS" \
            -destination "$DESTINATION" \
            -configuration Release \
            -derivedDataPath /tmp/DerivedData-Generator \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee /tmp/xcodebuild-generator.log
          echo "✅ XNU Image Generator for iOS Release build succeeded"

      - name: Package XNU Image Generator
        id: generator
        run: |
          set -euo pipefail
          BUILD_DIR=$(xcodebuild \
            -project "XNU Image Generator for iOS/XNU Image Generator for iOS.xcodeproj" \
            -scheme "XNU Image Generator for iOS" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath /tmp/DerivedData-Generator \
            -showBuildSettings \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>/dev/null | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')

          # Find the .app — scheme name may differ from product name
          APP=$(find "$BUILD_DIR" -maxdepth 1 -name '*.app' -type d | sed -n '1p') || true
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            APP_NAME=$(basename "$APP")
            cd "$(dirname "$APP")"
            zip -r /tmp/XNUImageGenerator-iOS-Simulator.zip "$APP_NAME"
            echo "✅ Packaged: XNUImageGenerator-iOS-Simulator.zip"
            ls -lh /tmp/XNUImageGenerator-iOS-Simulator.zip
          else
            echo "⚠️ iOS Generator app not found, skipping"
          fi

      - name: Run static analysis
        run: |
          set -euo pipefail
          xcodebuild analyze \
            -project "XNU Image Fuzzer/XNU Image Fuzzer.xcodeproj" \
            -scheme "XNU Image Fuzzer" \
            -destination "$DESTINATION" \
            -configuration Release \
            -derivedDataPath /tmp/DerivedData-Fuzzer \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            RUN_CLANG_STATIC_ANALYZER=YES \
            2>&1 | tee /tmp/xcodebuild-release-analyze.log | tail -10
          echo "✅ Static analysis passed"

      - name: Generate build metadata
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cat > /tmp/build-metadata.txt <<EOF
          XNU Image Tools — Build Metadata
          ==================================
          Version:    ${VERSION}
          Commit:     ${{ github.sha }}
          Date:       $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Runner:     $(uname -m) / $(sw_vers -productVersion)
          Xcode:      ${{ steps.xcode.outputs.xcode_version }}
          Build:      Release (iOS Simulator, universal arch)

          Included Projects:
            - XNU Image Fuzzer (iOS Simulator)
            - XNU Image Generator for iOS (iOS Simulator)
            - VideoToolbox Fuzzer (source code)

          SHA-256 Checksums:
          $(shasum -a 256 /tmp/XNUImageFuzzer-Simulator.zip)
          $([ -f /tmp/XNUImageGenerator-iOS-Simulator.zip ] && shasum -a 256 /tmp/XNUImageGenerator-iOS-Simulator.zip || echo "  (iOS Generator not included)")
          EOF
          cat /tmp/build-metadata.txt

      - name: Upload Fuzzer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XNUImageFuzzer-Simulator-${{ steps.version.outputs.version }}
          path: /tmp/XNUImageFuzzer-Simulator.zip
          retention-days: 90
          if-no-files-found: error

      - name: Upload Generator artifact
        if: hashFiles('/tmp/XNUImageGenerator-iOS-Simulator.zip') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XNUImageGenerator-iOS-Simulator-${{ steps.version.outputs.version }}
          path: /tmp/XNUImageGenerator-iOS-Simulator.zip
          retention-days: 90
          if-no-files-found: warn

      - name: Upload build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-metadata-${{ steps.version.outputs.version }}
          path: /tmp/build-metadata.txt
          retention-days: 90

  generate-corpus:
    name: Generate Fuzzed Image Corpus
    runs-on: macos-latest
    needs: build-release
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Build for Simulator (Debug — for image generation)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "XNU Image Fuzzer/XNU Image Fuzzer.xcodeproj" \
            -scheme "XNU Image Fuzzer" \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee /tmp/xcodebuild-corpus-build.log | tail -5
          echo "✅ Debug build for image generation"

      - name: Generate fuzzed images
        run: |
          set -euo pipefail
          export FUZZ_OUTPUT_DIR="/tmp/fuzzed-release"
          mkdir -p "$FUZZ_OUTPUT_DIR"

          BUILD_DIR=$(xcodebuild \
            -project "XNU Image Fuzzer/XNU Image Fuzzer.xcodeproj" \
            -scheme "XNU Image Fuzzer" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath /tmp/DerivedData \
            -showBuildSettings \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>/dev/null | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')

          BINARY="$BUILD_DIR/XNU Image Fuzzer.app/XNU Image Fuzzer"
          if [ -f "$BINARY" ]; then
            echo "🔧 Running fuzzer to generate corpus..."
            "$BINARY" 2>&1 | tail -20 || true
          fi

          # Python fallback — generate diverse seed images
          python3 -c "
          from PIL import Image
          import os
          out = os.environ.get('FUZZ_OUTPUT_DIR', '/tmp/fuzzed-release')
          configs = [
            ('seed_rgba_8bit', 'RGBA', (256,256)),
            ('seed_rgb_8bit', 'RGB', (512,512)),
            ('seed_gray_8bit', 'L', (128,128)),
            ('seed_16bit', 'I;16', (256,256)),
            ('seed_wide', 'RGBA', (1920,1080)),
            ('seed_square', 'RGBA', (1024,1024)),
            ('seed_tiny', 'RGBA', (1,1)),
            ('seed_strip', 'RGBA', (4096,1)),
          ]
          for name, mode, size in configs:
            img = Image.new(mode, size)
            pixels = img.load()
            for y in range(size[1]):
              for x in range(size[0]):
                if mode == 'RGBA':
                  pixels[x,y] = ((x*7+y*13)%256,(x*11+y*3)%256,(x*5+y*17)%256,255)
                elif mode == 'RGB':
                  pixels[x,y] = ((x*7+y*13)%256,(x*11+y*3)%256,(x*5+y*17)%256)
                elif mode == 'L':
                  pixels[x,y] = (x*y)%256
                elif mode == 'I;16':
                  pixels[x,y] = (x*y*3)%65536
            img.save(f'{out}/{name}.png')
            print(f'  ✅ {name}.png ({size[0]}x{size[1]} {mode})')
          " 2>&1 || echo "⚠️ PIL not available"

          COUNT=$(find "$FUZZ_OUTPUT_DIR" -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.gif' -o -name '*.tiff' -o -name '*.bmp' \) | wc -l | tr -d ' ')
          echo "📊 Generated ${COUNT} images for release corpus"

      - name: Package corpus
        run: |
          set -euo pipefail
          cd /tmp
          tar czf fuzzed-image-corpus.tar.gz -C fuzzed-release .
          ls -lh fuzzed-image-corpus.tar.gz

      - name: Upload corpus artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzed-image-corpus-${{ needs.build-release.outputs.version }}
          path: /tmp/fuzzed-image-corpus.tar.gz
          retention-days: 90
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-release, generate-corpus]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/release-artifacts

      - name: Generate release notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-release.outputs.version }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p') || true

          cat > /tmp/release-notes.md <<'NOTES_EOF'
          ## XNU Image Tools ${VERSION}

          Multi-platform image processing toolkit for fuzzing UTI file formats on Apple platforms.

          ### 📦 Release Artifacts

          | Artifact | Description |
          |----------|-------------|
          | `XNUImageFuzzer-Simulator.zip` | XNU Image Fuzzer — iOS Simulator app (Release) |
          | `XNUImageGenerator-iOS-Simulator.zip` | XNU Image Generator — iOS Simulator app (Release) |
          | `fuzzed-image-corpus.tar.gz` | Sample fuzzed images for testing image parsers |
          | `build-metadata.txt` | Build environment, checksums |

          ### 🔧 Usage

          **Install on iOS Simulator:**
          ```bash
          # XNU Image Fuzzer
          unzip XNUImageFuzzer-Simulator.zip
          xcrun simctl install booted "XNU Image Fuzzer.app"

          # XNU Image Generator
          unzip XNUImageGenerator-iOS-Simulator.zip
          xcrun simctl install booted "XNU Image Generator for iOS.app"
          ```

          **Fuzzed Image Corpus:**
          ```bash
          tar xzf fuzzed-image-corpus.tar.gz -C ./test-images/
          ```

          **VideoToolbox Fuzzer (macOS command-line):**
          ```bash
          cd VideoToolbox/Fuzzing
          make
          ./videotoolbox-runner <input-file>
          ```

          ### 🛡️ Security
          - Built with `GCC_TREAT_WARNINGS_AS_ERRORS=YES`
          - Clang static analysis passed
          - All checksums in `build-metadata.txt`
          NOTES_EOF

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$VERSION" ]; then
            echo "" >> /tmp/release-notes.md
            echo "### 📝 Changes since ${PREV_TAG}" >> /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md
            git log "${PREV_TAG}..HEAD" --oneline --no-merges | sed -n '1,30p' >> /tmp/release-notes.md
          fi

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets
          find /tmp/release-artifacts -type f | while read -r f; do
            cp "$f" /tmp/assets/
          done
          echo "📦 Release assets:"
          ls -lh /tmp/assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-release.outputs.version }}"

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "ℹ️  Release ${VERSION} exists — uploading assets"
            gh release upload "${VERSION}" /tmp/assets/* --clobber
          else
            gh release create "${VERSION}" \
              --title "XNU Image Tools ${VERSION}" \
              --notes-file /tmp/release-notes.md \
              --verify-tag \
              /tmp/assets/*
          fi

          echo "✅ Release ready: ${VERSION}"
