name: build-and-test

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc {0}

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test validator
        run: |
          set -euo pipefail
          python3 -m unittest contrib/scripts/test_validate_generated_images.py
          python3 -m compileall -q contrib/scripts
      - name: Reject retired behavior
        run: |
          set -euo pipefail
          if git grep -nEi 'fuzz|mutat|corrupt|fault.inject|\.random\(' -- \
              '*.swift' '.github/scripts/*.sh'; then
            echo "Retired generation behavior is present" >&2
            exit 1
          fi

  build-and-generate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build iOS simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project 'XNU Image Generator for iOS/XNU Image Generator for iOS.xcodeproj' \
            -scheme 'XNU Image Generator for iOS' \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build watchOS simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project 'XNU Image Generator for Watch/XNU Image Generator.xcodeproj' \
            -scheme 'XNU Image Generator Watch App' \
            -configuration Release \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Generate and validate ICC matrix
        run: |
          set -euo pipefail
          .github/scripts/generate-clean-images.sh generated-images both
      - name: Upload QA corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-image-qa-${{ github.sha }}
          path: generated-images
          if-no-files-found: error
          retention-days: 14
