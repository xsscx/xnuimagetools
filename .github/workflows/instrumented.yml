###############################################################
#
# Intent: xnuimagetools-instrumented
#
# Build all tools with AddressSanitizer, UndefinedBehaviorSanitizer,
# and code coverage instrumentation. Run fuzzers under sanitizers
# and generate coverage reports for improving test coverage.
#
# Produces:
#   - ASAN+UBSAN instrumented VideoToolbox binaries
#   - ASAN+UBSAN instrumented iOS Fuzzer (.app)
#   - Code coverage reports (llvm-cov text + HTML + lcov)
#   - Sanitizer findings report
#
# Security hardening (iccDEV patterns):
#   - Pinned action SHAs
#   - Least-privilege permissions
#   - persist-credentials: false
#   - BASH_ENV=/dev/null
#   - No user-controllable inputs in run: blocks
#   - Concurrency control with cancel-in-progress
#
###############################################################

name: xnuimagetools-instrumented

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

env:
  BASH_ENV: /dev/null
  SCHEME: "XNU Image Fuzzer"
  PROJECT: "XNU Image Fuzzer/XNU Image Fuzzer.xcodeproj"
  DESTINATION: "generic/platform=iOS Simulator"

defaults:
  run:
    shell: bash --noprofile --norc {0}

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.m'
      - '**/*.h'
      - '**/*.c'
      - '**/*.swift'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.m'
      - '**/*.h'
      - '**/*.c'
      - '**/*.swift'
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: 'VideoToolbox fuzzing duration in seconds'
        required: false
        default: '60'
        type: string

jobs:
  # ── Job 1: Instrumented VideoToolbox Build + Fuzz + Coverage ──
  # DISABLED: Moving to local macOS hardware for VideoToolbox testing
  videotoolbox-instrumented:
    if: false
    name: VideoToolbox (ASAN+UBSAN+Coverage)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Show toolchain
        run: |
          set -euo pipefail
          clang --version 2>&1 | sed -n '1,2p'
          xcrun --sdk macosx --show-sdk-path
          echo "LLVM tools:"
          xcrun llvm-profdata show --version 2>&1 | sed -n '1p' || echo "llvm-profdata available"
          xcrun llvm-cov show --version 2>&1 | sed -n '1p' || echo "llvm-cov available"

      - name: Build instrumented interposer
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          mkdir -p build

          SANITIZER_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls"
          COVERAGE_FLAGS="-fprofile-instr-generate -fcoverage-mapping"

          xcrun -sdk macosx clang \
            -arch arm64 -g -O1 -Wall -Wextra \
            $SANITIZER_FLAGS $COVERAGE_FLAGS \
            -dynamiclib \
            -framework IOKit \
            -framework CoreFoundation \
            -framework CoreMedia \
            -framework CoreVideo \
            -framework VideoToolbox \
            -lz \
            -o build/videotoolbox-interposer.dylib \
            videotoolbox-interposer.c
          codesign -s "-" --force build/videotoolbox-interposer.dylib
          echo "✅ Instrumented interposer built"

      - name: Build instrumented videotoolbox-runner
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail

          SANITIZER_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls"
          COVERAGE_FLAGS="-fprofile-instr-generate -fcoverage-mapping"

          xcrun -sdk macosx clang \
            -arch arm64 -g -O1 -Wall -Wextra \
            $SANITIZER_FLAGS $COVERAGE_FLAGS \
            -o build/videotoolbox-runner \
            videotoolbox-runner.m \
            build/videotoolbox-interposer.dylib \
            -framework VideoToolbox \
            -framework Foundation \
            -framework AVFoundation \
            -framework CoreFoundation \
            -framework CoreMedia \
            -framework CoreVideo \
            -framework CoreImage \
            -framework CoreGraphics \
            -framework ImageIO \
            -framework UniformTypeIdentifiers \
            -lz
          codesign -s "-" --force build/videotoolbox-runner
          echo "✅ Instrumented videotoolbox-runner built"

      - name: Build instrumented runner
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail

          SANITIZER_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls"
          COVERAGE_FLAGS="-fprofile-instr-generate -fcoverage-mapping"

          clang -isysroot "$(xcrun --sdk macosx --show-sdk-path)" \
            -O1 -Wall -Wextra -g \
            $SANITIZER_FLAGS $COVERAGE_FLAGS \
            -o build/runner runner.c
          codesign -s "-" --force build/runner

          clang -isysroot "$(xcrun --sdk macosx --show-sdk-path)" \
            -O1 -Wall -Wextra -g \
            $SANITIZER_FLAGS $COVERAGE_FLAGS \
            -o build/runner_dist runner_dist.c
          codesign -s "-" --force build/runner_dist
          echo "✅ Instrumented runner + runner_dist built"

      - name: Run fuzzer under sanitizers
        timeout-minutes: 5
        working-directory: VideoToolbox/Fuzzing
        env:
          FUZZ_DURATION: ${{ inputs.fuzz_duration || '60' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuzzed-video /tmp/profraw /tmp/sanitizer-logs

          export ASAN_OPTIONS="detect_leaks=0:halt_on_error=0:print_stats=1:log_path=/tmp/sanitizer-logs/asan"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=0:log_path=/tmp/sanitizer-logs/ubsan"
          export LLVM_PROFILE_FILE="/tmp/profraw/vt-%m_%p.profraw"

          echo "🔨 Running instrumented fuzzer for ${FUZZ_DURATION}s..."
          build/videotoolbox-runner \
            -t "$FUZZ_DURATION" \
            -o /tmp/fuzzed-video \
            big.mov > /tmp/fuzz-instrumented.log 2>&1 &
          VT_PID=$!

          # Hard watchdog: kill if fuzz() hangs past duration
          WATCHDOG_SECS=$((FUZZ_DURATION + 30))
          ( sleep "$WATCHDOG_SECS" && kill $VT_PID 2>/dev/null ) &
          WATCHDOG_PID=$!

          wait $VT_PID 2>/dev/null || true
          EXIT=$?

          # Clean up watchdog
          kill $WATCHDOG_PID 2>/dev/null || true
          wait $WATCHDOG_PID 2>/dev/null || true

          echo "Exit code: ${EXIT:-0}"

          # Kill any orphan atos/symbolizer processes left by ASAN
          for PID in $(pgrep -f 'atos' 2>/dev/null || true); do
            kill "$PID" 2>/dev/null || true
          done
          sleep 1

          # Show last 50 lines of fuzzer output
          echo "--- Fuzzer output (last 50 lines) ---"
          tail -50 /tmp/fuzz-instrumented.log || true

          # Collect sanitizer findings
          echo "## Sanitizer Findings" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          ASAN_COUNT=0
          UBSAN_COUNT=0
          if ls /tmp/sanitizer-logs/asan.* 1>/dev/null 2>&1; then
            ASAN_COUNT=$(grep -c "ERROR: AddressSanitizer" /tmp/sanitizer-logs/asan.* 2>/dev/null || echo "0")
            echo "### AddressSanitizer" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/sanitizer-logs/asan.* >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if ls /tmp/sanitizer-logs/ubsan.* 1>/dev/null 2>&1; then
            UBSAN_COUNT=$(grep -c "runtime error:" /tmp/sanitizer-logs/ubsan.* 2>/dev/null || echo "0")
            echo "### UndefinedBehaviorSanitizer" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/sanitizer-logs/ubsan.* >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Sanitizer | Findings |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|----------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ASAN | ${ASAN_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| UBSAN | ${UBSAN_COUNT} |" >> "$GITHUB_STEP_SUMMARY"

          FILE_COUNT=$(find /tmp/fuzzed-video -name "*.png" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Generated $FILE_COUNT fuzzed frames"

      - name: Validate VideoToolbox output quality
        if: always()
        run: |
          set -euo pipefail
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## VideoToolbox Output Quality" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          TOTAL=0
          VALID=0
          INVALID=0
          ZERO_SIZE=0

          echo "| File | Size | Format | Dimensions | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|--------|------------|--------|" >> "$GITHUB_STEP_SUMMARY"

          for f in /tmp/fuzzed-video/*.png; do
            [ -f "$f" ] || continue
            TOTAL=$((TOTAL + 1))
            NAME=$(basename "$f")
            SIZE=$(stat -f%z "$f" 2>/dev/null || stat --printf="%s" "$f" 2>/dev/null || echo "0")

            if [ "$SIZE" -eq 0 ]; then
              ZERO_SIZE=$((ZERO_SIZE + 1))
              INVALID=$((INVALID + 1))
              echo "| $NAME | 0 B | — | — | ❌ Empty |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            FORMAT=$(sips -g format "$f" 2>/dev/null | tail -1 | awk '{print $2}' || echo "unknown")
            WIDTH=$(sips -g pixelWidth "$f" 2>/dev/null | tail -1 | awk '{print $2}' || echo "?")
            HEIGHT=$(sips -g pixelHeight "$f" 2>/dev/null | tail -1 | awk '{print $2}' || echo "?")

            if [ "$FORMAT" != "unknown" ] && [ "$WIDTH" != "?" ] && [ "$HEIGHT" != "?" ]; then
              VALID=$((VALID + 1))
              STATUS="✅ Valid"
            else
              INVALID=$((INVALID + 1))
              STATUS="⚠️ $(file -b "$f" | cut -c1-40)"
            fi

            SIZE_H=$(numfmt --to=iec "$SIZE" 2>/dev/null || echo "${SIZE} B")
            echo "| $NAME | $SIZE_H | $FORMAT | ${WIDTH}×${HEIGHT} | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total frames | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Valid images | $VALID |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Invalid/unknown | $INVALID |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Zero-size files | $ZERO_SIZE |" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate coverage report
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          mkdir -p /tmp/coverage-report

          # Merge profraw files
          PROFRAW_COUNT=$(find /tmp/profraw -name "*.profraw" -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$PROFRAW_COUNT" -eq 0 ]; then
            echo "⚠️  No profraw files found — coverage data not generated"
            echo "This can happen if the fuzzer crashed before writing profile data."
            echo "No profraw files collected." > /tmp/coverage-report/summary.txt
            exit 0
          fi

          echo "Merging $PROFRAW_COUNT profraw files..."
          xcrun llvm-profdata merge -sparse \
            /tmp/profraw/*.profraw \
            -o /tmp/coverage-report/merged.profdata

          echo "## Code Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Text summary
          echo "### Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          xcrun llvm-cov report \
            build/videotoolbox-runner \
            -instr-profile=/tmp/coverage-report/merged.profdata \
            -ignore-filename-regex='.*/(usr|System)/.*' \
            2>&1 | tee /tmp/coverage-report/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Detailed line-by-line coverage
          xcrun llvm-cov show \
            build/videotoolbox-runner \
            -instr-profile=/tmp/coverage-report/merged.profdata \
            -ignore-filename-regex='.*/(usr|System)/.*' \
            -format=html \
            -output-dir=/tmp/coverage-report/html \
            2>&1 || echo "HTML report generation failed (non-fatal)"

          # LCOV export for integration with coverage tools
          xcrun llvm-cov export \
            build/videotoolbox-runner \
            -instr-profile=/tmp/coverage-report/merged.profdata \
            -ignore-filename-regex='.*/(usr|System)/.*' \
            -format=lcov \
            > /tmp/coverage-report/coverage.lcov \
            2>&1 || echo "LCOV export failed (non-fatal)"

          # Text annotated source (for easy reading)
          xcrun llvm-cov show \
            build/videotoolbox-runner \
            -instr-profile=/tmp/coverage-report/merged.profdata \
            -ignore-filename-regex='.*/(usr|System)/.*' \
            -format=text \
            > /tmp/coverage-report/annotated-source.txt \
            2>&1 || echo "Text report generation failed (non-fatal)"

          # Extract key metrics for summary
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Coverage Files" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`summary.txt\` — function/line/region coverage percentages" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`coverage.lcov\` — LCOV format for CI integrations" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`html/\` — interactive HTML coverage report" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`annotated-source.txt\` — line-by-line hit counts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Show uncovered functions for improvement guidance
          echo "### Functions Needing Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          xcrun llvm-cov report \
            build/videotoolbox-runner \
            -instr-profile=/tmp/coverage-report/merged.profdata \
            -ignore-filename-regex='.*/(usr|System)/.*' \
            -show-functions \
            2>&1 | grep -E '^\S.*0\.00%' | sed -n '1,30p' >> "$GITHUB_STEP_SUMMARY" || echo "(all functions covered)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: videotoolbox-coverage-report
          path: /tmp/coverage-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: videotoolbox-sanitizer-logs
          path: /tmp/sanitizer-logs/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload instrumented binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: videotoolbox-instrumented-binaries
          path: |
            VideoToolbox/Fuzzing/build/videotoolbox-runner
            VideoToolbox/Fuzzing/build/videotoolbox-interposer.dylib
            VideoToolbox/Fuzzing/build/runner
            VideoToolbox/Fuzzing/build/runner_dist
          retention-days: 14
          if-no-files-found: warn

  # ── Job 2: Instrumented iOS Fuzzer (Mac Catalyst) ─────────
  ios-instrumented:
    name: iOS Fuzzer (Mac Catalyst ASAN+UBSAN+Coverage)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Build Mac Catalyst with ASAN + UBSAN + Coverage
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -configuration Debug \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CLANG_ADDRESS_SANITIZER=YES \
            CLANG_UNDEFINED_BEHAVIOR_SANITIZER=YES \
            CLANG_ENABLE_CODE_COVERAGE=YES \
            GCC_GENERATE_DEBUGGING_SYMBOLS=YES \
            OTHER_CFLAGS='$(inherited) -fno-omit-frame-pointer' \
            2>&1 | tee /tmp/xcodebuild-instrumented.log
          echo "✅ Mac Catalyst instrumented build succeeded"

      - name: Locate binary
        id: locate
        run: |
          set -euo pipefail
          BINARY=$(find /tmp/DerivedData -name "XNU Image Fuzzer" -type f -perm +111 \
            ! -path "*/XNU Image Fuzzer.app/Contents/Resources/*" \
            | sed -n '1p')
          if [ -z "$BINARY" ]; then
            echo "❌ Binary not found"
            exit 1
          fi
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"
          file "$BINARY"
          echo "✅ Located: $BINARY"

      - name: Run fuzzer under sanitizers with coverage
        timeout-minutes: 5
        run: |
          set -euo pipefail
          BINARY="${{ steps.locate.outputs.binary }}"
          APP_BUNDLE=$(echo "$BINARY" | sed 's|/Contents/MacOS/.*||')
          mkdir -p /tmp/profraw-ios /tmp/sanitizer-logs-ios /tmp/fuzzed-output-ios

          # Set env vars via export AND launchctl (belt-and-suspenders)
          export FUZZ_OUTPUT_DIR="/tmp/fuzzed-output-ios"
          export LLVM_PROFILE_FILE="/tmp/profraw-ios/fuzzer-%m_%p.profraw"
          export ASAN_OPTIONS="detect_leaks=0:halt_on_error=0:print_stats=1:log_path=/tmp/sanitizer-logs-ios/asan"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=0:log_path=/tmp/sanitizer-logs-ios/ubsan"

          launchctl setenv FUZZ_OUTPUT_DIR "$FUZZ_OUTPUT_DIR"
          launchctl setenv LLVM_PROFILE_FILE "$LLVM_PROFILE_FILE"
          launchctl setenv ASAN_OPTIONS "$ASAN_OPTIONS"
          launchctl setenv UBSAN_OPTIONS "$UBSAN_OPTIONS"
          sleep 1

          echo "🔨 Launching Mac Catalyst fuzzer: $APP_BUNDLE"
          echo "   LLVM_PROFILE_FILE=$LLVM_PROFILE_FILE"

          # Launch via 'open --env' (macOS 13+) — passes env vars directly to process
          open --env FUZZ_OUTPUT_DIR="$FUZZ_OUTPUT_DIR" \
               --env LLVM_PROFILE_FILE="$LLVM_PROFILE_FILE" \
               --env ASAN_OPTIONS="$ASAN_OPTIONS" \
               --env UBSAN_OPTIONS="$UBSAN_OPTIONS" \
               "$APP_BUNDLE" &
          OPEN_PID=$!
          disown $OPEN_PID
          echo "✅ App launched (open PID $OPEN_PID), waiting for fuzzing to complete..."

          # Poll for output files (fuzzing runs in viewDidLoad)
          # 17 specs × 6 files each (seed + corrupted + 4 format variants) = 102 expected
          for i in $(seq 1 120); do
            FILE_COUNT=$(find /tmp/fuzzed-output-ios -type f 2>/dev/null | wc -l | tr -d ' ')
            if [ "$FILE_COUNT" -ge 80 ]; then
              echo "✅ Found $FILE_COUNT files after ${i}s"
              break
            fi
            if [ "$((i % 10))" -eq 0 ]; then
              echo "⏳ ${FILE_COUNT} files after ${i}s..."
            fi
            sleep 1
          done

          # Extra time for last files to flush
          sleep 5

          # Terminate app gracefully for profraw flush:
          # SIGINT triggers atexit() handlers (including llvm profraw writer)
          APP_PID=$(pgrep -f "XNU Image Fuzzer" 2>/dev/null || true)
          if [ -n "$APP_PID" ]; then
            echo "Sending SIGINT to app (PID $APP_PID) for profraw flush..."
            kill -INT "$APP_PID" 2>/dev/null || true
            sleep 3

            if kill -0 "$APP_PID" 2>/dev/null; then
              echo "App still running, sending SIGTERM..."
              kill "$APP_PID" 2>/dev/null || true
              sleep 2
            fi
          fi

          echo "Profraw files in /tmp/profraw-ios/:"
          ls -la /tmp/profraw-ios/ 2>/dev/null || echo "  (none)"

          FILE_COUNT=$(find /tmp/fuzzed-output-ios -type f 2>/dev/null | wc -l | tr -d ' ')
          PROFRAW_COUNT=$(find /tmp/profraw-ios -name "*.profraw" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Generated $FILE_COUNT fuzzed images, $PROFRAW_COUNT profraw files"
          ls -la /tmp/fuzzed-output-ios/ 2>/dev/null || true

          # Sanitizer findings
          echo "## iOS Fuzzer Sanitizer Findings" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          ASAN_COUNT=0
          UBSAN_COUNT=0
          if ls /tmp/sanitizer-logs-ios/asan.* 1>/dev/null 2>&1; then
            ASAN_COUNT=$(grep -c "ERROR: AddressSanitizer" /tmp/sanitizer-logs-ios/asan.* 2>/dev/null || echo "0")
          fi
          if ls /tmp/sanitizer-logs-ios/ubsan.* 1>/dev/null 2>&1; then
            UBSAN_COUNT=$(grep -c "runtime error:" /tmp/sanitizer-logs-ios/ubsan.* 2>/dev/null || echo "0")
          fi

          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ASAN findings | ${ASAN_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| UBSAN findings | ${UBSAN_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fuzzed images | ${FILE_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Profraw files | ${PROFRAW_COUNT} |" >> "$GITHUB_STEP_SUMMARY"

          # Ensure artifact directories have at least a summary file
          echo "ASAN: ${ASAN_COUNT}, UBSAN: ${UBSAN_COUNT}, Images: ${FILE_COUNT}" \
            > /tmp/sanitizer-logs-ios/summary.txt

      - name: Validate iOS fuzzer output quality
        if: always()
        run: |
          set -euo pipefail
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## iOS Fuzzer Output Quality" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          TOTAL=0
          VALID=0
          INVALID=0
          ZERO_SIZE=0

          echo "| File | Size | Format | Dimensions | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|--------|------------|--------|" >> "$GITHUB_STEP_SUMMARY"

          for f in /tmp/fuzzed-output-ios/*; do
            [ -f "$f" ] || continue
            TOTAL=$((TOTAL + 1))
            NAME=$(basename "$f")
            SIZE=$(stat -f%z "$f" 2>/dev/null || stat --printf="%s" "$f" 2>/dev/null || echo "0")

            if [ "$SIZE" -eq 0 ]; then
              ZERO_SIZE=$((ZERO_SIZE + 1))
              INVALID=$((INVALID + 1))
              echo "| $NAME | 0 B | — | — | ❌ Empty |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            FORMAT=$(sips -g format "$f" 2>/dev/null | tail -1 | awk '{print $2}' || echo "unknown")
            WIDTH=$(sips -g pixelWidth "$f" 2>/dev/null | tail -1 | awk '{print $2}' || echo "?")
            HEIGHT=$(sips -g pixelHeight "$f" 2>/dev/null | tail -1 | awk '{print $2}' || echo "?")

            if [ "$FORMAT" != "unknown" ] && [ "$WIDTH" != "?" ] && [ "$HEIGHT" != "?" ]; then
              VALID=$((VALID + 1))
              STATUS="✅ Valid"
            else
              INVALID=$((INVALID + 1))
              STATUS="⚠️ $(file -b "$f" | cut -c1-40)"
            fi

            SIZE_H=$(numfmt --to=iec "$SIZE" 2>/dev/null || echo "${SIZE} B")
            echo "| $NAME | $SIZE_H | $FORMAT | ${WIDTH}×${HEIGHT} | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total files | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Valid images | $VALID |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Invalid/unknown | $INVALID |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Zero-size files | $ZERO_SIZE |" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate iOS coverage report
        run: |
          set -euo pipefail
          BINARY="${{ steps.locate.outputs.binary }}"
          mkdir -p /tmp/coverage-report-ios

          PROFRAW_COUNT=$(find /tmp/profraw-ios -name "*.profraw" -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$PROFRAW_COUNT" -eq 0 ]; then
            echo "⚠️  No profraw files — coverage not generated"
            echo "No profraw files collected." > /tmp/coverage-report-ios/summary.txt
            exit 0
          fi

          xcrun llvm-profdata merge -sparse \
            /tmp/profraw-ios/*.profraw \
            -o /tmp/coverage-report-ios/merged.profdata

          echo "## iOS Fuzzer Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          xcrun llvm-cov report "$BINARY" \
            -instr-profile=/tmp/coverage-report-ios/merged.profdata \
            -ignore-filename-regex='.*/(usr|System|DerivedData)/.*' \
            2>&1 | tee /tmp/coverage-report-ios/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          xcrun llvm-cov show "$BINARY" \
            -instr-profile=/tmp/coverage-report-ios/merged.profdata \
            -ignore-filename-regex='.*/(usr|System|DerivedData)/.*' \
            -format=html -output-dir=/tmp/coverage-report-ios/html 2>&1 || true

          xcrun llvm-cov export "$BINARY" \
            -instr-profile=/tmp/coverage-report-ios/merged.profdata \
            -ignore-filename-regex='.*/(usr|System|DerivedData)/.*' \
            -format=lcov > /tmp/coverage-report-ios/coverage.lcov 2>&1 || true

      - name: Upload iOS coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-fuzzer-coverage-report
          path: /tmp/coverage-report-ios/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload iOS sanitizer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-fuzzer-sanitizer-logs
          path: |
            /tmp/sanitizer-logs-ios/
            /tmp/ios-fuzzer-output.log
          retention-days: 30
          if-no-files-found: warn

  # ── Job 3: Summary ──────────────────────────────────────────
  instrumentation-summary:
    name: Instrumentation Summary
    runs-on: ubuntu-latest
    needs: [ios-instrumented]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: videotoolbox-coverage-report
          path: /tmp/coverage
        continue-on-error: true

      - name: Download iOS coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-fuzzer-coverage-report
          path: /tmp/ios-coverage
        continue-on-error: true

      - name: Summary
        run: |
          set -euo pipefail

          echo "## Instrumented Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build Configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AddressSanitizer | ✅ Enabled |" >> "$GITHUB_STEP_SUMMARY"
          echo "| UndefinedBehaviorSanitizer | ✅ Enabled |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code Coverage | ✅ Enabled |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frame Pointers | ✅ Preserved |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Debug Symbols | ✅ Enabled |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f /tmp/coverage/summary.txt ]; then
            echo "### VideoToolbox Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f /tmp/ios-coverage/summary.txt ]; then
            echo "### iOS Fuzzer Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/ios-coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- **videotoolbox-coverage-report** — HTML + LCOV + text coverage reports" >> "$GITHUB_STEP_SUMMARY"
          echo "- **videotoolbox-instrumented-binaries** — ASAN+UBSAN binaries for local testing" >> "$GITHUB_STEP_SUMMARY"
          echo "- **videotoolbox-sanitizer-logs** — ASAN/UBSAN findings" >> "$GITHUB_STEP_SUMMARY"
          echo "- **ios-fuzzer-coverage-report** — iOS fuzzer coverage (Mac Catalyst)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **ios-fuzzer-sanitizer-logs** — iOS runtime sanitizer output" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Improving Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Download \`videotoolbox-coverage-report\` artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Open \`html/index.html\` for interactive line-by-line coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Review \`annotated-source.txt\` for uncovered code paths" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Check functions with 0% coverage in the summary above" >> "$GITHUB_STEP_SUMMARY"
          echo "5. Add test inputs that exercise uncovered branches" >> "$GITHUB_STEP_SUMMARY"

  # ── Job 4: Native clang Build + Run + Coverage ─────────────
  # Xcode's CLANG_ENABLE_CODE_COVERAGE=YES does NOT inject
  # -fprofile-instr-generate for Mac Catalyst. This job compiles
  # directly with clang, producing real profraw/llvm-cov output.
  native-coverage:
    name: Native Coverage (clang arm64)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Show toolchain
        run: |
          set -euo pipefail
          clang --version 2>&1 | sed -n '1p'
          xcodebuild -version 2>&1 | sed -n '1p'
          uname -m
          xcrun llvm-profdata show --version 2>&1 | sed -n '1p'

      - name: Build + Run + Coverage
        run: |
          set -euo pipefail
          .github/scripts/build-native.sh 2>&1 | tee /tmp/build-native.log

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Native Coverage (clang arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/coverage-report/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          ASAN_HITS=$(grep -c "ASAN findings:" /tmp/build-native.log 2>/dev/null || true)
          UBSAN_HITS=$(grep -c "UBSAN findings:" /tmp/build-native.log 2>/dev/null || true)
          FILE_COUNT=$(find /tmp/fuzzed-output -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fuzzed images | ${FILE_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ASAN findings | ${ASAN_HITS:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| UBSAN findings | ${UBSAN_HITS:-0} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-coverage-report
          path: /tmp/coverage-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload fuzzed images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-fuzzed-images
          path: /tmp/fuzzed-output/
          retention-days: 14
          if-no-files-found: warn
