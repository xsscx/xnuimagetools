###############################################################
#
# Intent: xnuimagetools-instrumented
#
# Three-job pipeline (each with macOS 14 + 15 matrix):
#   Job 1 — ASAN+UBSAN sanitizer testing for iOS Fuzzer (Mac Catalyst, xcodebuild)
#   Job 2 — macOS native build + ASAN+UBSAN (clang, no Xcode project)
#   Job 3 — Code coverage via native clang (arm64, no xcodebuild)
#
# Xcode's CLANG_ENABLE_CODE_COVERAGE=YES does NOT inject
# -fprofile-instr-generate for Mac Catalyst builds, so coverage
# is handled exclusively by the native-coverage job.
#
# VideoToolbox instrumented testing lives in videotoolbox.yml.
#
# Produces:
#   - ASAN+UBSAN instrumented iOS Fuzzer (.app)
#   - Sanitizer findings report
#   - Code coverage reports (llvm-cov text + HTML + lcov)
#
# Security hardening (iccDEV patterns):
#   - Pinned action SHAs
#   - Least-privilege permissions
#   - persist-credentials: false
#   - BASH_ENV=/dev/null
#   - No user-controllable inputs in run: blocks
#   - Concurrency control with cancel-in-progress
#
###############################################################

name: xnuimagetools-instrumented

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

env:
  BASH_ENV: /dev/null
  SCHEME: "XNU Image Fuzzer"
  PROJECT: "XNU Image Fuzzer/XNU Image Fuzzer.xcodeproj"
  DESTINATION: "generic/platform=iOS Simulator"

defaults:
  run:
    shell: bash --noprofile --norc {0}

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.m'
      - '**/*.h'
      - '**/*.c'
      - '**/*.swift'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.m'
      - '**/*.h'
      - '**/*.c'
      - '**/*.swift'
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: 'VideoToolbox fuzzing duration in seconds'
        required: false
        default: '60'
        type: string

jobs:
  # ── Job 1: Instrumented iOS Fuzzer (Mac Catalyst) ─────────
  ios-instrumented:
    name: iOS Fuzzer (Mac Catalyst ASAN+UBSAN — ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Build Mac Catalyst with ASAN + UBSAN
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -configuration Debug \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CLANG_ADDRESS_SANITIZER=YES \
            CLANG_UNDEFINED_BEHAVIOR_SANITIZER=YES \
            GCC_GENERATE_DEBUGGING_SYMBOLS=YES \
            OTHER_CFLAGS='$(inherited) -fno-omit-frame-pointer' \
            2>&1 | tee /tmp/xcodebuild-instrumented.log
          echo "✅ Mac Catalyst instrumented build succeeded"

      - name: Locate binary
        id: locate
        run: |
          set -euo pipefail
          BINARY=$(find /tmp/DerivedData -name "XNU Image Fuzzer" -type f -perm +111 \
            ! -path "*/XNU Image Fuzzer.app/Contents/Resources/*" \
            | sed -n '1p')
          if [ -z "$BINARY" ]; then
            echo "❌ Binary not found"
            exit 1
          fi
          echo "binary=$BINARY" >> "$GITHUB_OUTPUT"
          file "$BINARY"
          echo "✅ Located: $BINARY"

      - name: Run fuzzer under sanitizers
        timeout-minutes: 5
        run: |
          set -euo pipefail
          BINARY="${{ steps.locate.outputs.binary }}"
          APP_BUNDLE=$(echo "$BINARY" | sed 's|/Contents/MacOS/.*||')
          mkdir -p /tmp/sanitizer-logs-ios /tmp/fuzzed-output-ios

          export FUZZ_OUTPUT_DIR="/tmp/fuzzed-output-ios"
          export ASAN_OPTIONS="detect_leaks=0:halt_on_error=0:print_stats=1:log_path=/tmp/sanitizer-logs-ios/asan"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=0:log_path=/tmp/sanitizer-logs-ios/ubsan"

          launchctl setenv FUZZ_OUTPUT_DIR "$FUZZ_OUTPUT_DIR"
          launchctl setenv ASAN_OPTIONS "$ASAN_OPTIONS"
          launchctl setenv UBSAN_OPTIONS "$UBSAN_OPTIONS"
          sleep 1

          echo "🔨 Launching Mac Catalyst fuzzer: $APP_BUNDLE"

          open --env FUZZ_OUTPUT_DIR="$FUZZ_OUTPUT_DIR" \
               --env ASAN_OPTIONS="$ASAN_OPTIONS" \
               --env UBSAN_OPTIONS="$UBSAN_OPTIONS" \
               "$APP_BUNDLE" &
          OPEN_PID=$!
          disown $OPEN_PID
          echo "✅ App launched (open PID $OPEN_PID), waiting for fuzzing to complete..."

          # Poll for output files (fuzzing runs in viewDidLoad)
          # 17 specs × 6 files each (seed + corrupted + 4 format variants) = 102 expected
          for i in $(seq 1 120); do
            FILE_COUNT=$(find /tmp/fuzzed-output-ios -type f 2>/dev/null | wc -l | tr -d ' ')
            if [ "$FILE_COUNT" -ge 80 ]; then
              echo "✅ Found $FILE_COUNT files after ${i}s"
              break
            fi
            if [ "$((i % 10))" -eq 0 ]; then
              echo "⏳ ${FILE_COUNT} files after ${i}s..."
            fi
            sleep 1
          done

          # Extra time for last files to flush
          sleep 5

          # Terminate app gracefully for profraw flush:
          # SIGINT triggers atexit() handlers (including llvm profraw writer)
          APP_PID=$(pgrep -f "XNU Image Fuzzer" 2>/dev/null || true)
          if [ -n "$APP_PID" ]; then
            echo "Sending SIGINT to app (PID $APP_PID) for profraw flush..."
            kill -INT "$APP_PID" 2>/dev/null || true
            sleep 3

            if kill -0 "$APP_PID" 2>/dev/null; then
              echo "App still running, sending SIGTERM..."
              kill "$APP_PID" 2>/dev/null || true
              sleep 2
            fi
          fi

          echo "Note: coverage collected in native-coverage job, not here"

          FILE_COUNT=$(find /tmp/fuzzed-output-ios -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Generated $FILE_COUNT fuzzed images"
          ls -la /tmp/fuzzed-output-ios/ 2>/dev/null || true

          # Sanitizer findings
          echo "## iOS Fuzzer Sanitizer Findings" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          ASAN_COUNT=0
          UBSAN_COUNT=0
          if ls /tmp/sanitizer-logs-ios/asan.* 1>/dev/null 2>&1; then
            ASAN_COUNT=$(grep -c "ERROR: AddressSanitizer" /tmp/sanitizer-logs-ios/asan.* 2>/dev/null || echo "0")
          fi
          if ls /tmp/sanitizer-logs-ios/ubsan.* 1>/dev/null 2>&1; then
            UBSAN_COUNT=$(grep -c "runtime error:" /tmp/sanitizer-logs-ios/ubsan.* 2>/dev/null || echo "0")
          fi

          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ASAN findings | ${ASAN_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| UBSAN findings | ${UBSAN_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fuzzed images | ${FILE_COUNT} |" >> "$GITHUB_STEP_SUMMARY"

          # Ensure artifact directories have at least a summary file
          echo "ASAN: ${ASAN_COUNT}, UBSAN: ${UBSAN_COUNT}, Images: ${FILE_COUNT}" \
            > /tmp/sanitizer-logs-ios/summary.txt

      - name: Validate iOS fuzzer output quality
        if: always()
        run: |
          set -euo pipefail
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## iOS Fuzzer Output Quality" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          TOTAL=0
          VALID=0
          INVALID=0
          ZERO_SIZE=0

          echo "| File | Size | Format | Dimensions | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|--------|------------|--------|" >> "$GITHUB_STEP_SUMMARY"

          for f in /tmp/fuzzed-output-ios/*; do
            [ -f "$f" ] || continue
            TOTAL=$((TOTAL + 1))
            NAME=$(basename "$f")
            SIZE=$(stat -f%z "$f" 2>/dev/null || stat --printf="%s" "$f" 2>/dev/null || echo "0")

            if [ "$SIZE" -eq 0 ]; then
              ZERO_SIZE=$((ZERO_SIZE + 1))
              INVALID=$((INVALID + 1))
              echo "| $NAME | 0 B | — | — | ❌ Empty |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            FORMAT=$(sips -g format "$f" 2>/dev/null | tail -1 | awk '{print $2}' || echo "unknown")
            WIDTH=$(sips -g pixelWidth "$f" 2>/dev/null | tail -1 | awk '{print $2}' || echo "?")
            HEIGHT=$(sips -g pixelHeight "$f" 2>/dev/null | tail -1 | awk '{print $2}' || echo "?")

            if [ "$FORMAT" != "unknown" ] && [ "$WIDTH" != "?" ] && [ "$HEIGHT" != "?" ]; then
              VALID=$((VALID + 1))
              STATUS="✅ Valid"
            else
              INVALID=$((INVALID + 1))
              STATUS="⚠️ $(file -b "$f" | cut -c1-40)"
            fi

            SIZE_H=$(numfmt --to=iec "$SIZE" 2>/dev/null || echo "${SIZE} B")
            echo "| $NAME | $SIZE_H | $FORMAT | ${WIDTH}×${HEIGHT} | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total files | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Valid images | $VALID |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Invalid/unknown | $INVALID |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Zero-size files | $ZERO_SIZE |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS sanitizer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-fuzzer-sanitizer-logs-${{ matrix.os }}
          path: |
            /tmp/sanitizer-logs-ios/
            /tmp/ios-fuzzer-output.log
          retention-days: 30
          if-no-files-found: warn

  # ── Job 2: macOS Native Build (ASAN+UBSAN, no Xcode) ──────
  # Compiles xnuimagefuzzer.m directly with clang using the Mac
  # Catalyst target — validates the build works without xcodebuild.
  # Uses -target arm64-apple-ios-macabi because xnuimagefuzzer.m
  # requires UIKit (87 API references), which is only available
  # via Mac Catalyst on macOS (not the raw macOS SDK).
  macos-native:
    name: macOS Native (ASAN+UBSAN — ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          clang --version 2>&1 | sed -n '1p'
          uname -m

      - name: Build with ASAN + UBSAN
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --show-sdk-path)"
          SANITIZER_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls"
          SRC_DIR="XNU Image Fuzzer/XNU Image Fuzzer"

          mkdir -p /tmp/macos-native-build

          clang -arch arm64 \
            -target arm64-apple-ios17.2-macabi \
            -isysroot "$SDKROOT" \
            -iframework "$SDKROOT/System/iOSSupport/System/Library/Frameworks" \
            -g -O1 -Wall -Wextra \
            $SANITIZER_FLAGS \
            -DFUZZ_OUTPUT_DIR='"/tmp/fuzzed-output-native"' \
            -fobjc-arc \
            -I"$SRC_DIR" \
            -o /tmp/macos-native-build/xnuimagefuzzer \
            "$SRC_DIR/xnuimagefuzzer.m" \
            "$SRC_DIR/AppDelegate.m" \
            "$SRC_DIR/SceneDelegate.m" \
            "$SRC_DIR/ViewController.m" \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework ImageIO \
            -framework UniformTypeIdentifiers \
            2>&1 | head -50

          echo "✅ macOS native build succeeded"
          file /tmp/macos-native-build/xnuimagefuzzer
          codesign -s "-" --force /tmp/macos-native-build/xnuimagefuzzer

      - name: Run under sanitizers
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuzzed-output-native /tmp/sanitizer-logs-native

          export FUZZ_OUTPUT_DIR="/tmp/fuzzed-output-native"
          export ASAN_OPTIONS="detect_leaks=0:halt_on_error=0:print_stats=1:log_path=/tmp/sanitizer-logs-native/asan"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=0:log_path=/tmp/sanitizer-logs-native/ubsan"

          echo "🔨 Running macOS native fuzzer..."
          /tmp/macos-native-build/xnuimagefuzzer 2>&1 | tail -30 || true

          FILE_COUNT=$(find /tmp/fuzzed-output-native -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Generated $FILE_COUNT fuzzed images"

          # Sanitizer findings
          echo "## macOS Native Sanitizer Findings (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          ASAN_COUNT=0
          UBSAN_COUNT=0
          if ls /tmp/sanitizer-logs-native/asan.* 1>/dev/null 2>&1; then
            ASAN_COUNT=$(grep -c "ERROR: AddressSanitizer" /tmp/sanitizer-logs-native/asan.* 2>/dev/null || echo "0")
          fi
          if ls /tmp/sanitizer-logs-native/ubsan.* 1>/dev/null 2>&1; then
            UBSAN_COUNT=$(grep -c "runtime error:" /tmp/sanitizer-logs-native/ubsan.* 2>/dev/null || echo "0")
          fi

          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ASAN findings | ${ASAN_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| UBSAN findings | ${UBSAN_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fuzzed images | ${FILE_COUNT} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-native-sanitizer-logs-${{ matrix.os }}
          path: /tmp/sanitizer-logs-native/
          retention-days: 30
          if-no-files-found: warn

  # ── Job 3: Native clang Build + Run + Coverage ─────────────
  # Xcode's CLANG_ENABLE_CODE_COVERAGE=YES does NOT inject
  # -fprofile-instr-generate for Mac Catalyst. This job compiles
  # directly with clang, producing real profraw/llvm-cov output.
  native-coverage:
    name: Native Coverage (clang arm64 — ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Show toolchain
        run: |
          set -euo pipefail
          clang --version 2>&1 | sed -n '1p'
          xcodebuild -version 2>&1 | sed -n '1p'
          uname -m
          xcrun llvm-profdata show --version 2>&1 | sed -n '1p'

      - name: Build + Run + Coverage
        run: |
          set -euo pipefail
          .github/scripts/build-native.sh 2>&1 | tee /tmp/build-native.log

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Native Coverage (clang arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/coverage-report/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          ASAN_HITS=$(grep -c "ASAN findings:" /tmp/build-native.log 2>/dev/null || true)
          UBSAN_HITS=$(grep -c "UBSAN findings:" /tmp/build-native.log 2>/dev/null || true)
          FILE_COUNT=$(find /tmp/fuzzed-output -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fuzzed images | ${FILE_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ASAN findings | ${ASAN_HITS:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| UBSAN findings | ${UBSAN_HITS:-0} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-coverage-report-${{ matrix.os }}
          path: /tmp/coverage-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload fuzzed images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-fuzzed-images-${{ matrix.os }}
          path: /tmp/fuzzed-output/
          retention-days: 14
          if-no-files-found: warn
