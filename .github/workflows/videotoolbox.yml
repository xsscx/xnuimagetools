###############################################################
#
# Intent: xnuimagetools-videotoolbox
#
# Build and test the VideoToolbox fuzzing harness (macOS native).
# Produces command-line tools for iOS/macOS video codec fuzzing:
#   - runner (macOS, runs iOS binaries via interposition)
#   - runner_dist (macOS, distributed runner)
#   - videotoolbox-runner (macOS, VideoToolbox fuzzer)
#   - videotoolbox-interposer.dylib (macOS, function interposer)
#
# Security hardening (iccDEV patterns):
#   - Pinned action SHAs
#   - Least-privilege permissions
#   - persist-credentials: false
#   - BASH_ENV=/dev/null
#   - No user-controllable inputs in run: blocks
#   - Concurrency control with cancel-in-progress
#
###############################################################

name: xnuimagetools-videotoolbox

permissions:
  contents: read

concurrency:
  group: videotoolbox-${{ github.ref }}
  cancel-in-progress: true

env:
  BASH_ENV: /dev/null

defaults:
  run:
    shell: bash --noprofile --norc {0}

on:
  push:
    branches: [main, master]
    paths:
      - 'VideoToolbox/**'
      - '.github/workflows/videotoolbox.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'VideoToolbox/**'
      - '.github/workflows/videotoolbox.yml'
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: 'Fuzzing duration in seconds'
        required: false
        default: '60'
        type: string

jobs:
  build-macos:
    name: Build VideoToolbox Fuzzer (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Show toolchain
        run: |
          set -euo pipefail
          clang --version 2>&1 | sed -n '1,2p'
          xcrun --sdk macosx --show-sdk-path
          echo "---"
          uname -m
          sw_vers -productVersion

      - name: Build runner (macOS)
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          mkdir -p build
          clang -isysroot "$(xcrun --sdk macosx --show-sdk-path)" \
            -O2 -Wall -Wextra \
            -o build/runner runner.c
          codesign -s "-" --force build/runner
          file build/runner
          echo "✅ runner built"

      - name: Build runner_dist (macOS)
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          clang -isysroot "$(xcrun --sdk macosx --show-sdk-path)" \
            -O2 -Wall -Wextra \
            -o build/runner_dist runner_dist.c
          codesign -s "-" --force build/runner_dist
          file build/runner_dist
          echo "✅ runner_dist built"

      - name: Build videotoolbox-interposer.dylib (macOS)
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          xcrun -sdk macosx clang \
            -arch arm64 -g -O1 -Wall -Wextra \
            -dynamiclib \
            -framework IOKit \
            -framework CoreFoundation \
            -framework CoreMedia \
            -framework CoreVideo \
            -framework VideoToolbox \
            -lz \
            -o build/videotoolbox-interposer.dylib \
            videotoolbox-interposer.c
          codesign -s "-" --force build/videotoolbox-interposer.dylib
          file build/videotoolbox-interposer.dylib
          echo "✅ videotoolbox-interposer.dylib built"

      - name: Build videotoolbox-runner (macOS)
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          xcrun -sdk macosx clang \
            -arch arm64 -g -O1 -Wall -Wextra \
            -o build/videotoolbox-runner \
            videotoolbox-runner.m \
            build/videotoolbox-interposer.dylib \
            -framework VideoToolbox \
            -framework Foundation \
            -framework AVFoundation \
            -framework CoreFoundation \
            -framework CoreMedia \
            -framework CoreVideo \
            -framework CoreImage \
            -framework CoreGraphics \
            -framework ImageIO \
            -framework UniformTypeIdentifiers \
            -lz
          codesign -s "-" --force build/videotoolbox-runner
          file build/videotoolbox-runner
          echo "✅ videotoolbox-runner built"

      - name: Verify all artifacts
        id: verify
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          echo "## VideoToolbox Build Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Binary | Type | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|------|------|" >> "$GITHUB_STEP_SUMMARY"

          PASS=0
          FAIL=0
          for bin in build/runner build/runner_dist build/videotoolbox-runner build/videotoolbox-interposer.dylib; do
            if [ -f "$bin" ]; then
              TYPE=$(file -b "$bin" | cut -c1-60)
              SIZE=$(stat -f%z "$bin" 2>/dev/null || stat -c%s "$bin")
              echo "✅ $(basename $bin): $TYPE ($SIZE bytes)"
              echo "| $(basename $bin) | $TYPE | $SIZE bytes |" >> "$GITHUB_STEP_SUMMARY"
              PASS=$((PASS + 1))
            else
              echo "❌ Missing: $bin"
              FAIL=$((FAIL + 1))
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Result:** ${PASS} passed, ${FAIL} failed" >> "$GITHUB_STEP_SUMMARY"
          echo "build_dir=$(pwd)/build" >> "$GITHUB_OUTPUT"

          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi

      - name: Smoke test — runner help
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          # Verify runner loads and executes (will print usage/error since no args)
          build/runner 2>&1 || EXIT=$?
          echo "runner exit code: ${EXIT:-0}"
          echo "✅ runner loads and executes"

      - name: Smoke test — videotoolbox-runner help
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          # Run with -h to verify it loads frameworks and prints usage
          build/videotoolbox-runner -h 2>&1
          echo "✅ videotoolbox-runner loads and executes"

      - name: Package artifacts
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          mkdir -p /tmp/videotoolbox-release
          cp build/runner build/runner_dist \
             build/videotoolbox-runner build/videotoolbox-interposer.dylib \
             /tmp/videotoolbox-release/
          # Include the helper script and sample config
          cp video-fuzzer.zsh entitlements.xml Info.plist \
             /tmp/videotoolbox-release/ 2>/dev/null || true
          # Include source for reference
          cp videotoolbox-runner.m videotoolbox-interposer.c \
             runner.c runner_dist.c interpose.c \
             /tmp/videotoolbox-release/ 2>/dev/null || true
          cd /tmp
          tar czf videotoolbox-fuzzer-macos.tar.gz -C videotoolbox-release .
          ls -lh videotoolbox-fuzzer-macos.tar.gz

      - name: Upload VideoToolbox artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: videotoolbox-fuzzer-macos
          path: /tmp/videotoolbox-fuzzer-macos.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          set -euo pipefail
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Environment" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| macOS | $(sw_vers -productVersion) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Xcode | $(xcodebuild -version 2>&1 | sed -n '1p') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Arch | $(uname -m) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| clang | $(clang --version 2>&1 | sed -n '1p') |" >> "$GITHUB_STEP_SUMMARY"

  # ── Job: Instrumented Build + Coverage ─────────────────────
  # Builds videotoolbox-runner + interposer with
  # -fprofile-instr-generate -fcoverage-mapping, runs a short
  # fuzz, and uploads llvm-cov HTML + LCOV reports.
  #
  # NOTE: ASAN is omitted because malloc_zone_print() in the
  # hot loop causes multi-minute hangs under ASAN.  ASAN testing
  # is handled separately by the fuzz-and-commit job.
  coverage:
    name: Coverage (clang arm64)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Show toolchain
        run: |
          set -euo pipefail
          clang --version 2>&1 | sed -n '1p'
          uname -m
          xcrun llvm-profdata show --version 2>&1 | sed -n '1p'

      - name: Build interposer with coverage
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          mkdir -p build-cov
          xcrun -sdk macosx clang \
            -arch arm64 -g -O1 -Wall -Wextra \
            -fprofile-instr-generate -fcoverage-mapping \
            -dynamiclib \
            -framework IOKit \
            -framework CoreFoundation \
            -framework CoreMedia \
            -framework CoreVideo \
            -framework VideoToolbox \
            -lz \
            -o build-cov/videotoolbox-interposer.dylib \
            videotoolbox-interposer.c
          codesign -s "-" --force build-cov/videotoolbox-interposer.dylib
          echo "✅ interposer built with coverage"

      - name: Build runner with coverage
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          xcrun -sdk macosx clang \
            -arch arm64 -g -O1 -Wall -Wextra \
            -fprofile-instr-generate -fcoverage-mapping \
            -o build-cov/videotoolbox-runner \
            videotoolbox-runner.m \
            build-cov/videotoolbox-interposer.dylib \
            -framework VideoToolbox \
            -framework Foundation \
            -framework AVFoundation \
            -framework CoreFoundation \
            -framework CoreMedia \
            -framework CoreVideo \
            -framework CoreImage \
            -framework CoreGraphics \
            -framework ImageIO \
            -framework UniformTypeIdentifiers \
            -lz
          codesign -s "-" --force build-cov/videotoolbox-runner
          echo "✅ runner built with coverage"

      - name: Run fuzzer with coverage collection
        working-directory: VideoToolbox/Fuzzing
        env:
          FUZZ_DURATION: ${{ inputs.fuzz_duration || '60' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vt-profraw /tmp/fuzzed-video

          LLVM_PROFILE_FILE=/tmp/vt-profraw/%m.profraw \
            build-cov/videotoolbox-runner \
              -t "$FUZZ_DURATION" \
              -o /tmp/fuzzed-video \
              big.mov 2>&1 | tee /tmp/vt-run.log || EXIT=$?

          echo "Exit code: ${EXIT:-0}"
          FILE_COUNT=$(find /tmp/fuzzed-video -name "*.png" -type f 2>/dev/null | wc -l | tr -d ' ')
          PROFRAW_COUNT=$(find /tmp/vt-profraw -name "*.profraw" 2>/dev/null | wc -l | tr -d ' ')
          echo "Fuzzed frames: $FILE_COUNT"
          echo "Profraw files: $PROFRAW_COUNT"
          [ "$PROFRAW_COUNT" -gt 0 ] || { echo "❌ No profraw — coverage failed"; exit 1; }
          echo "✅ Coverage data collected"

      - name: Generate coverage report
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          mkdir -p /tmp/vt-coverage

          xcrun llvm-profdata merge -sparse /tmp/vt-profraw/*.profraw \
            -o /tmp/vt-coverage/merged.profdata

          # Text summary
          xcrun llvm-cov report \
            build-cov/videotoolbox-runner \
            -object build-cov/videotoolbox-interposer.dylib \
            -instr-profile=/tmp/vt-coverage/merged.profdata \
            | tee /tmp/vt-coverage/summary.txt

          # HTML report
          xcrun llvm-cov show \
            build-cov/videotoolbox-runner \
            -object build-cov/videotoolbox-interposer.dylib \
            -instr-profile=/tmp/vt-coverage/merged.profdata \
            -format=html -output-dir=/tmp/vt-coverage/html

          # LCOV export
          xcrun llvm-cov export \
            build-cov/videotoolbox-runner \
            -object build-cov/videotoolbox-interposer.dylib \
            -instr-profile=/tmp/vt-coverage/merged.profdata \
            -format=lcov > /tmp/vt-coverage/coverage.lcov

          # Step summary
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## VideoToolbox Coverage (clang arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/vt-coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: videotoolbox-coverage-report
          path: /tmp/vt-coverage/
          retention-days: 30
          if-no-files-found: warn

  static-analysis:
    name: Static Analysis (VideoToolbox)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Run Clang Static Analyzer
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          mkdir -p /tmp/analyzer-output
          echo "## Clang Static Analyzer" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          WARNINGS=0
          for src in runner.c runner_dist.c main.c interpose.c videotoolbox-interposer.c; do
            echo "🔍 Analyzing $src..."
            xcrun clang --analyze \
              -isysroot "$(xcrun --sdk macosx --show-sdk-path)" \
              -Xanalyzer -analyzer-output=text \
              -framework IOKit \
              -framework CoreFoundation \
              "$src" 2>&1 | tee "/tmp/analyzer-$src.log" || true
            W=$(grep -c "warning:" "/tmp/analyzer-$src.log" 2>/dev/null || echo "0")
            WARNINGS=$((WARNINGS + W))
            if [ "$W" -gt 0 ]; then
              echo "| $src | ⚠️ $W warnings |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $src | ✅ clean |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # Analyze ObjC source separately (needs Foundation)
          echo "🔍 Analyzing videotoolbox-runner.m..."
          xcrun clang --analyze \
            -isysroot "$(xcrun --sdk macosx --show-sdk-path)" \
            -Xanalyzer -analyzer-output=text \
            -framework Foundation \
            -framework AVFoundation \
            -framework VideoToolbox \
            -framework CoreFoundation \
            -framework CoreMedia \
            -framework CoreVideo \
            -framework CoreImage \
            -framework CoreGraphics \
            -framework ImageIO \
            -framework UniformTypeIdentifiers \
            videotoolbox-runner.m 2>&1 | tee "/tmp/analyzer-runner.m.log" || true
          W=$(grep -c "warning:" "/tmp/analyzer-runner.m.log" 2>/dev/null || echo "0")
          WARNINGS=$((WARNINGS + W))
          if [ "$W" -gt 0 ]; then
            echo "| videotoolbox-runner.m | ⚠️ $W warnings |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| videotoolbox-runner.m | ✅ clean |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total warnings: $WARNINGS**" >> "$GITHUB_STEP_SUMMARY"
          echo "📊 Static analysis: $WARNINGS total warnings"

  fuzz-and-commit:
    name: Fuzz and Commit Results
    runs-on: macos-latest
    needs: build-macos
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: videotoolbox-fuzzer-macos
          path: /tmp/videotoolbox-download

      - name: Extract and prepare artifacts
        working-directory: VideoToolbox/Fuzzing
        run: |
          set -euo pipefail
          mkdir -p build
          tar xzf /tmp/videotoolbox-download/videotoolbox-fuzzer-macos.tar.gz -C build/
          chmod +x build/videotoolbox-runner build/runner build/runner_dist
          codesign -s "-" --force build/videotoolbox-runner
          codesign -s "-" --force build/videotoolbox-interposer.dylib
          file build/videotoolbox-runner
          echo "✅ Artifacts extracted from build-macos job"

      - name: Run VideoToolbox fuzzer
        working-directory: VideoToolbox/Fuzzing
        env:
          FUZZ_DURATION: ${{ inputs.fuzz_duration || '60' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fuzzed-video

          echo "🔨 Fuzzing for ${FUZZ_DURATION}s..."
          # macOS has no GNU timeout; use perl one-liner as portable alternative
          perl -e 'alarm shift; exec @ARGV' "$((FUZZ_DURATION + 30))" \
            build/videotoolbox-runner \
              -t "$FUZZ_DURATION" \
              -o /tmp/fuzzed-video \
              big.mov 2>&1 | tee /tmp/fuzz-output.log || EXIT=$?

          echo "Exit code: ${EXIT:-0}"
          FILE_COUNT=$(find /tmp/fuzzed-video -name "*.png" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "fuzz_file_count=$FILE_COUNT" >> "$GITHUB_ENV"

          echo "## VideoToolbox Fuzzing Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Duration | ${FUZZ_DURATION}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Output files | ${FILE_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Exit code | ${EXIT:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "⚠️  No fuzzed frames generated"
          else
            echo "✅ Generated $FILE_COUNT fuzzed frames"
            ls -lh /tmp/fuzzed-video/ | sed -n '1,20p'
          fi

      - name: Upload fuzzed video artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzed-video-frames
          path: /tmp/fuzzed-video/
          retention-days: 30
          if-no-files-found: warn

      - name: Commit fuzzed video frames
        if: env.fuzz_file_count != '0'
        run: |
          set -euo pipefail

          TIMESTAMP=$(date -u '+%Y-%m-%d-%H%M%S')
          DEST_DIR="fuzzed-video/${TIMESTAMP}"
          mkdir -p "$DEST_DIR"

          FILE_COUNT=$(find /tmp/fuzzed-video -name "*.png" -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "⚠️  No fuzzed frames to commit"
            exit 0
          fi

          cp /tmp/fuzzed-video/*.png "$DEST_DIR/"
          echo "Copied $FILE_COUNT files to $DEST_DIR"
          ls -la "$DEST_DIR/" | sed -n '1,20p'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "fuzzed-video/"
          git commit -m "fuzzed-video: ${TIMESTAMP} — ${FILE_COUNT} frames

          Generated by xnuimagetools-videotoolbox workflow
          Duration: ${{ inputs.fuzz_duration || '60' }}s
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git pull --rebase origin main
          git push
          echo "✅ Committed $FILE_COUNT fuzzed video frames to $DEST_DIR"
