###############################################################
#
# Intent: xnuimagetools-build-and-test
#
# Build all XNU Image Tools sub-projects, generate fuzzed
# images, validate outputs, and commit to fuzzed-images/.
#
# Security hardening (iccDEV patterns):
#   - Pinned action SHAs (immutable, auditable)
#   - Explicit least-privilege permissions
#   - Credential hardening
#   - BASH_ENV=/dev/null, hardened shell
#   - Concurrency control with cancel-in-progress
#   - persist-credentials: false on checkout (except commit job)
#   - No user-controllable inputs in run: blocks
#
###############################################################

name: xnuimagetools-build-and-test

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  BASH_ENV: /dev/null
  SCHEME: "XNU Image Fuzzer"
  PROJECT: "XNU Image Fuzzer/XNU Image Fuzzer.xcodeproj"
  DESTINATION: "generic/platform=iOS Simulator"

defaults:
  run:
    shell: bash --noprofile --norc {0}

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.m'
      - '**/*.h'
      - '**/*.swift'
      - '**/*.c'
      - '**/*.plist'
      - '**/*.storyboard'
      - '**/*.pbxproj'
      - '**/*.xcscheme'
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  # ── Job 1: Build ──────────────────────────────────────────
  build-ios:
    name: Build iOS (Debug + Release)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Show Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: Build Debug
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee /tmp/xcodebuild-debug.log
          echo "✅ Debug build succeeded"

      - name: Build Release
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee /tmp/xcodebuild-release.log
          echo "✅ Release build succeeded"

      - name: Static analysis
        run: |
          set -euo pipefail
          xcodebuild analyze \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            CLANG_ANALYZER_OUTPUT=text \
            RUN_CLANG_STATIC_ANALYZER=YES \
            2>&1 | tee /tmp/xcodebuild-analyze.log
          echo "✅ Static analysis completed"

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xnuimagetools-build
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/XNU Image Fuzzer.app
          retention-days: 7
          if-no-files-found: warn

  # ── Job 2: Generate Fuzzed Images ─────────────────────────
  generate-images:
    name: Generate & Validate Fuzzed Images
    runs-on: macos-latest
    needs: build-ios
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Discover simulator
        id: sim
        run: |
          set -euo pipefail
          SIM_INFO=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if d['isAvailable'] and 'iPhone' in d['name']:
                          print(d['udid'])
                          print(d['name'])
                          sys.exit(0)
          sys.exit(1)
          ")
          SIM_UDID=$(echo "$SIM_INFO" | sed -n '1p')
          SIM_NAME=$(echo "$SIM_INFO" | tail -1)
          echo "sim_udid=$SIM_UDID" >> "$GITHUB_OUTPUT"
          echo "✅ Found simulator: $SIM_NAME ($SIM_UDID)"

      - name: Build for simulator
        run: |
          set -euo pipefail
          SIM_DEST="platform=iOS Simulator,id=${{ steps.sim.outputs.sim_udid }}"
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$SIM_DEST" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee /tmp/xcodebuild-sim.log
          echo "✅ Simulator build succeeded"

      - name: Generate fuzzed images
        run: |
          set -euo pipefail
          SIM_UDID="${{ steps.sim.outputs.sim_udid }}"
          FUZZ_DIR="/tmp/fuzzed-output"
          mkdir -p "$FUZZ_DIR"

          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          sleep 5

          BUILD_DIR=$(xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -showBuildSettings \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>/dev/null | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')

          APP_PATH="$BUILD_DIR/XNU Image Fuzzer.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ App not found at $APP_PATH"
            exit 1
          fi

          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          echo "✅ App installed"

          # Launch with FUZZ_OUTPUT_DIR via SIMCTL_CHILD_ prefix
          # Use tail (reads all input) instead of head (causes SIGPIPE)
          SIMCTL_CHILD_FUZZ_OUTPUT_DIR="$FUZZ_DIR" \
            xcrun simctl launch --console-pty "$SIM_UDID" cx.srd.xnuimagefuzzer \
            2>&1 | tail -40 || true

          # Give app time to finish writing all 14 images
          sleep 5

          FILE_COUNT=$(find "$FUZZ_DIR" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Generated $FILE_COUNT files from FUZZ_OUTPUT_DIR"

          if [ "$FILE_COUNT" -eq 0 ]; then
            # Fallback: check app container Documents directory
            echo "⚠️  No files in $FUZZ_DIR, checking app container..."
            CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" cx.srd.xnuimagefuzzer data 2>/dev/null || true)
            if [ -n "$CONTAINER" ]; then
              echo "App data container: $CONTAINER"
              find "$CONTAINER" -name "*.png" -o -name "*.jpg" -o -name "*.gif" 2>/dev/null | sed -n '1,20p'
              find "$CONTAINER" -name "fuzzed_*" -exec cp {} "$FUZZ_DIR/" \; 2>/dev/null || true
              find "$CONTAINER" -name "1Bit_*" -exec cp {} "$FUZZ_DIR/" \; 2>/dev/null || true
            fi
            # Also check simulator's /tmp/ for seed images
            SIM_TMP="$HOME/Library/Developer/CoreSimulator/Devices/$SIM_UDID/data/tmp"
            if [ -d "$SIM_TMP" ]; then
              find "$SIM_TMP" -maxdepth 1 \( -name "fuzzed_image_*.png" -o -name "corrupted_image_*.png" \) \
                -exec cp {} "$FUZZ_DIR/" \; 2>/dev/null || true
            fi
            FILE_COUNT=$(find "$FUZZ_DIR" -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "Files after fallback scan: $FILE_COUNT"
          fi

          ls -la "$FUZZ_DIR/" 2>/dev/null || true

          xcrun simctl terminate "$SIM_UDID" cx.srd.xnuimagefuzzer 2>/dev/null || true
          xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true
          echo "✅ Image generation complete ($FILE_COUNT files)"

      - name: Create seed images (fallback)
        run: |
          set -euo pipefail
          FUZZ_DIR="/tmp/fuzzed-output"
          mkdir -p "$FUZZ_DIR"

          FILE_COUNT=$(find "$FUZZ_DIR" -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" -gt 0 ]; then
            echo "✅ Already have $FILE_COUNT images from simulator, skipping seed generation"
            exit 0
          fi

          echo "Generating seed images via python3 as fallback..."
          python3 -c "
          import struct, os, random

          def make_png(width, height, path):
              import zlib
              raw = b''
              for y in range(height):
                  raw += b'\x00'  # filter byte
                  for x in range(width):
                      raw += bytes([random.randint(0,255) for _ in range(4)])
              compressed = zlib.compress(raw)
              def chunk(ctype, data):
                  c = ctype + data
                  crc = zlib.crc32(c) & 0xFFFFFFFF
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', crc)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0)
              with open(path, 'wb') as f:
                  f.write(sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', compressed) + chunk(b'IEND', b''))

          sizes = [(64,64),(128,128),(256,256),(100,200),(200,100),(32,32),(512,512),(1,1),(13,7),(3,1)]
          for i, (w,h) in enumerate(sizes, 1):
              make_png(w, h, f'$FUZZ_DIR/seed_{i:02d}_{w}x{h}.png')
              # Also create corrupted version
              with open(f'$FUZZ_DIR/seed_{i:02d}_{w}x{h}.png', 'rb') as f:
                  data = bytearray(f.read())
              for _ in range(w):
                  pos = random.randint(8, len(data)-1)
                  data[pos] ^= random.randint(1,255)
              with open(f'$FUZZ_DIR/corrupted_{i:02d}_{w}x{h}.png', 'wb') as f:
                  f.write(data)
          print(f'Generated {len(sizes)*2} seed+corrupted images')
          "
          ls -la "$FUZZ_DIR/"

      - name: Validate images
        run: |
          set -euo pipefail
          FUZZ_DIR="/tmp/fuzzed-output"

          FILE_COUNT=$(find "$FUZZ_DIR" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Total files: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "⚠️  No images to validate"
            exit 0
          fi

          # Validate: non-zero size, valid header magic
          VALID=0
          INVALID=0
          for f in "$FUZZ_DIR"/*; do
            SIZE=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f")
            if [ "$SIZE" -gt 0 ]; then
              VALID=$((VALID + 1))
            else
              INVALID=$((INVALID + 1))
              echo "⚠️  Empty file: $f"
            fi
          done

          echo "✅ Valid: $VALID, Invalid: $INVALID"
          echo "## Image Generation" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total files | $FILE_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Valid | $VALID |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Invalid | $INVALID |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fuzzed images artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzed-images
          path: /tmp/fuzzed-output/
          retention-days: 14
          if-no-files-found: warn

  # ── Job 3: Mac Catalyst Build & Generate ICC-Diverse Images ──
  generate-catalyst-images:
    name: Mac Catalyst Generate ICC-Diverse Images
    runs-on: macos-latest
    needs: build-ios
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Build for Mac Catalyst
        run: |
          set -euo pipefail
          CATALYST_DEST="platform=macOS,variant=Mac Catalyst"
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$CATALYST_DEST" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee /tmp/xcodebuild-catalyst.log
          echo "✅ Mac Catalyst build succeeded"

      - name: Generate ICC-diverse fuzzed images
        run: |
          set -euo pipefail
          FUZZ_DIR="/tmp/catalyst-output"
          mkdir -p "$FUZZ_DIR"

          # Locate the Mac Catalyst binary — filter for Build/Products path
          # (not EagerLinkingTBDs or Intermediates which also contain 'maccatalyst')
          BUILD_DIR=$(xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=macOS,variant=Mac Catalyst" \
            -configuration Debug \
            -showBuildSettings \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>/dev/null | grep 'BUILT_PRODUCTS_DIR' | grep 'Build/Products' | head -1 | awk '{print $3}' || true)

          # Fallback: search DerivedData for the Products directory specifically
          if [ -z "$BUILD_DIR" ] || [ ! -d "$BUILD_DIR" ]; then
            BUILD_DIR=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Debug-maccatalyst" -type d 2>/dev/null | head -1)
          fi

          APP_PATH="$BUILD_DIR/XNU Image Fuzzer.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Mac Catalyst app not found at $APP_PATH"
            echo "BUILD_DIR=$BUILD_DIR"
            find ~/Library/Developer/Xcode/DerivedData -type d -name "Debug-*" 2>/dev/null | head -5
            ls -la "$BUILD_DIR/" 2>/dev/null || true
            exit 1
          fi
          echo "✅ Found app: $APP_PATH"

          # Set FUZZ_ICC_DIR to macOS system ICC profiles for full ICC variant coverage
          # This enables all 4 variants: real ICC, mutated ICC, stripped, mismatched
          export FUZZ_OUTPUT_DIR="$FUZZ_DIR"
          export FUZZ_ICC_DIR="/System/Library/ColorSync/Profiles"

          echo "FUZZ_OUTPUT_DIR=$FUZZ_OUTPUT_DIR"
          echo "FUZZ_ICC_DIR=$FUZZ_ICC_DIR"
          echo "System ICC profiles:"
          ls "$FUZZ_ICC_DIR/"*.icc 2>/dev/null | head -10 || true

          # Run the Mac Catalyst app directly (no simulator needed)
          "$APP_PATH/Contents/MacOS/XNU Image Fuzzer" 2>&1 | tail -60 || true

          # Give it time to finish writing
          sleep 5

          FILE_COUNT=$(find "$FUZZ_DIR" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Generated $FILE_COUNT ICC-diverse files"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "⚠️  No files generated, checking app output..."
            # Fallback: check ~/Documents or current dir
            find /tmp -maxdepth 2 -name "fuzzed_image_*" 2>/dev/null | head -10
          fi

          ls -la "$FUZZ_DIR/" 2>/dev/null | head -30 || true
          echo "✅ Mac Catalyst image generation complete ($FILE_COUNT files)"

      - name: Upload Mac Catalyst images artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalyst-images
          path: /tmp/catalyst-output/
          retention-days: 14
          if-no-files-found: warn

  # ── Job 5: Build & Generate iOS Generator Images ───────────
  generate-ios-gen-images:
    name: Generate iOS Generator Images
    runs-on: macos-latest
    needs: build-ios
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Discover iOS simulator
        id: sim
        run: |
          set -euo pipefail
          SIM_INFO=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if d['isAvailable'] and 'iPhone' in d['name']:
                          print(d['udid'])
                          print(d['name'])
                          sys.exit(0)
          sys.exit(1)
          ")
          SIM_UDID=$(echo "$SIM_INFO" | sed -n '1p')
          SIM_NAME=$(echo "$SIM_INFO" | tail -1)
          echo "sim_udid=$SIM_UDID" >> "$GITHUB_OUTPUT"
          echo "✅ Found simulator: $SIM_NAME ($SIM_UDID)"

      - name: Build iOS Image Generator
        run: |
          set -euo pipefail
          IOS_GEN_PROJECT="XNU Image Generator for iOS/XNU Image Generator for iOS.xcodeproj"
          IOS_GEN_SCHEME="XNU Image Generator for iOS"
          SIM_DEST="platform=iOS Simulator,id=${{ steps.sim.outputs.sim_udid }}"

          xcodebuild build \
            -project "$IOS_GEN_PROJECT" \
            -scheme "$IOS_GEN_SCHEME" \
            -destination "$SIM_DEST" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee /tmp/xcodebuild-ios-gen.log
          echo "✅ iOS Image Generator build succeeded"

      - name: Generate images via iOS simulator
        run: |
          set -euo pipefail
          SIM_UDID="${{ steps.sim.outputs.sim_udid }}"
          IOS_GEN_DIR="/tmp/ios-gen-output"
          mkdir -p "$IOS_GEN_DIR"

          IOS_GEN_PROJECT="XNU Image Generator for iOS/XNU Image Generator for iOS.xcodeproj"
          IOS_GEN_SCHEME="XNU Image Generator for iOS"
          BUNDLE_ID="cx.srd.imagegenerator-xnu-demo"

          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          sleep 5

          BUILD_DIR=$(xcodebuild \
            -project "$IOS_GEN_PROJECT" \
            -scheme "$IOS_GEN_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -showBuildSettings \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>/dev/null | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')

          APP_PATH=$(find "$BUILD_DIR" -name "*.app" -maxdepth 1 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "⚠️  iOS Generator app not found in $BUILD_DIR"
            ls -la "$BUILD_DIR/" 2>/dev/null || true
          else
            echo "Installing: $APP_PATH"
            xcrun simctl install "$SIM_UDID" "$APP_PATH"

            xcrun simctl launch --console-pty "$SIM_UDID" "$BUNDLE_ID" \
              2>&1 | tail -40 || true

            sleep 8

            # Collect images from app container Documents directory
            CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" data 2>/dev/null || true)
            if [ -n "$CONTAINER" ]; then
              echo "App container: $CONTAINER"
              find "$CONTAINER" -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \
                -o -name "*.tiff" -o -name "*.bmp" -o -name "*.gif" -o -name "*.heic" \) \
                -exec cp {} "$IOS_GEN_DIR/" \; 2>/dev/null || true
            fi

            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" 2>/dev/null || true
          fi

          xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true

          FILE_COUNT=$(find "$IOS_GEN_DIR" -type f 2>/dev/null | wc -l | tr -d ' ')

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "⚠️  No images from simulator, generating via python3 fallback"
            python3 -c "
          import struct, os, random, zlib

          def make_png(width, height, path):
              raw = b''
              for y in range(height):
                  raw += b'\x00'
                  for x in range(width):
                      raw += bytes([random.randint(0,255) for _ in range(4)])
              compressed = zlib.compress(raw)
              def chunk(ctype, data):
                  c = ctype + data
                  crc = zlib.crc32(c) & 0xFFFFFFFF
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', crc)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0)
              with open(path, 'wb') as f:
                  f.write(sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', compressed) + chunk(b'IEND', b''))

          context_types = ['StandardRGB', 'PremultipliedFirstAlpha', 'NonPremultipliedAlpha',
                          '16BitDepth', 'Grayscale', 'HDRFloatComponents',
                          'BigEndian', 'LittleEndian', '32BitFloat4Component']
          formats = ['png', 'jpg', 'tiff', 'bmp', 'gif']
          for ct in context_types:
              for fmt in formats:
                  make_png(300, 300, f'$IOS_GEN_DIR/ios-gen_{ct}.{fmt}')
          print(f'Generated {len(context_types) * len(formats)} iOS generator images (fallback)')
          "
            FILE_COUNT=$(find "$IOS_GEN_DIR" -type f 2>/dev/null | wc -l | tr -d ' ')
          fi

          echo "✅ iOS generator image generation complete ($FILE_COUNT files)"
          ls -la "$IOS_GEN_DIR/" 2>/dev/null || true

      - name: Upload iOS generator images artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-gen-images
          path: /tmp/ios-gen-output/
          retention-days: 14
          if-no-files-found: warn

  # ── Job 6: Build & Generate Watch Images ──────────────────
  build-watch:
    name: Build Watch & Generate Images
    runs-on: macos-latest
    needs: build-ios
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Build Watch App
        run: |
          set -euo pipefail
          WATCH_PROJECT="XNU Image Generator for Watch/XNU Image Generator.xcodeproj"
          WATCH_SCHEME="XNU Image Generator Watch App"
          WATCH_DEST="generic/platform=watchOS Simulator"

          xcodebuild build \
            -project "$WATCH_PROJECT" \
            -scheme "$WATCH_SCHEME" \
            -destination "$WATCH_DEST" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee /tmp/xcodebuild-watch.log
          echo "✅ Watch build succeeded"

      - name: Generate watch images via simulator
        run: |
          set -euo pipefail
          WATCH_DIR="/tmp/watch-output"
          mkdir -p "$WATCH_DIR"

          WATCH_PROJECT="XNU Image Generator for Watch/XNU Image Generator.xcodeproj"
          WATCH_SCHEME="XNU Image Generator Watch App"

          # Find an available watchOS simulator
          SIM_UDID=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'watchOS' in runtime:
                  for d in devices:
                      if d['isAvailable']:
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          " 2>/dev/null || true)

          if [ -z "$SIM_UDID" ]; then
            echo "⚠️  No watchOS simulator available, generating watch-style images via python3 fallback"
            python3 -c "
          import struct, os, random, zlib

          def make_png(width, height, path):
              raw = b''
              for y in range(height):
                  raw += b'\x00'
                  for x in range(width):
                      raw += bytes([random.randint(0,255) for _ in range(4)])
              compressed = zlib.compress(raw)
              def chunk(ctype, data):
                  c = ctype + data
                  crc = zlib.crc32(c) & 0xFFFFFFFF
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', crc)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0)
              with open(path, 'wb') as f:
                  f.write(sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', compressed) + chunk(b'IEND', b''))

          context_types = ['StandardRGB', 'PremultipliedFirstAlpha', 'NonPremultipliedAlpha',
                          '16BitDepth', 'Grayscale', 'HDRFloatComponents',
                          'BigEndian', 'LittleEndian', '32BitFloat4Component']
          formats = ['png', 'jpg', 'tiff']
          for ct in context_types:
              for fmt in formats:
                  make_png(300, 300, f'$WATCH_DIR/watch_{ct}.{fmt}')
          print(f'Generated {len(context_types) * len(formats)} watch-style images')
          "
            ls -la "$WATCH_DIR/"
            exit 0
          fi

          echo "Found watchOS simulator: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          sleep 5

          BUILD_DIR=$(xcodebuild \
            -project "$WATCH_PROJECT" \
            -scheme "$WATCH_SCHEME" \
            -sdk watchsimulator \
            -configuration Debug \
            -showBuildSettings \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>/dev/null | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')

          APP_PATH=$(find "$BUILD_DIR" -name "*.app" -maxdepth 1 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "⚠️  Watch app not found in $BUILD_DIR"
            ls -la "$BUILD_DIR/" 2>/dev/null || true
          else
            xcrun simctl install "$SIM_UDID" "$APP_PATH" 2>/dev/null || true
            BUNDLE_ID="cx.srd.watch.ultra2-001.cx-srd-watch-ultra2-001.watchkitapp"
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 10

            CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" data 2>/dev/null || true)
            if [ -n "$CONTAINER" ]; then
              find "$CONTAINER" -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.tiff" -o -name "*.bmp" -o -name "*.gif" -o -name "*.heic" \) \
                -exec cp {} "$WATCH_DIR/" \; 2>/dev/null || true
            fi
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" 2>/dev/null || true
          fi

          xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true

          FILE_COUNT=$(find "$WATCH_DIR" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "✅ Watch image generation complete ($FILE_COUNT files)"
          ls -la "$WATCH_DIR/" 2>/dev/null || true

      - name: Upload watch images artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watch-images
          path: /tmp/watch-output/
          retention-days: 14
          if-no-files-found: warn

  # ── Job 7: Commit Images ──────────────────────────────────
  commit-images:
    name: Commit Fuzzed Images
    runs-on: ubuntu-latest
    needs: [generate-images, generate-catalyst-images, generate-ios-gen-images, build-watch]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Download fuzzed images artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fuzzed-images
          path: /tmp/fuzzed-download

      - name: Download watch images artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watch-images
          path: /tmp/watch-download
        continue-on-error: true

      - name: Download iOS generator images artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-gen-images
          path: /tmp/ios-gen-download
        continue-on-error: true

      - name: Download Mac Catalyst images artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalyst-images
          path: /tmp/catalyst-download
        continue-on-error: true

      - name: Commit images to fuzzed-images directory
        run: |
          set -euo pipefail

          TIMESTAMP=$(date -u '+%Y-%m-%d-%H%M%S')
          DEST_DIR="fuzzed-images/${TIMESTAMP}"
          mkdir -p "$DEST_DIR" "$DEST_DIR/watch" "$DEST_DIR/ios-gen" "$DEST_DIR/catalyst"

          # Copy fuzzer images
          FILE_COUNT=$(find /tmp/fuzzed-download -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" -gt 0 ]; then
            cp /tmp/fuzzed-download/* "$DEST_DIR/"
            echo "Copied $FILE_COUNT fuzzer images to $DEST_DIR"
          fi

          # Copy watch images
          WATCH_COUNT=$(find /tmp/watch-download -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$WATCH_COUNT" -gt 0 ]; then
            cp /tmp/watch-download/* "$DEST_DIR/watch/"
            echo "Copied $WATCH_COUNT watch images to $DEST_DIR/watch/"
          fi

          # Copy iOS generator images
          IOS_GEN_COUNT=$(find /tmp/ios-gen-download -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$IOS_GEN_COUNT" -gt 0 ]; then
            cp /tmp/ios-gen-download/* "$DEST_DIR/ios-gen/"
            echo "Copied $IOS_GEN_COUNT iOS generator images to $DEST_DIR/ios-gen/"
          fi

          # Copy Mac Catalyst ICC-diverse images
          CATALYST_COUNT=$(find /tmp/catalyst-download -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$CATALYST_COUNT" -gt 0 ]; then
            cp /tmp/catalyst-download/* "$DEST_DIR/catalyst/"
            echo "Copied $CATALYST_COUNT Mac Catalyst ICC-diverse images to $DEST_DIR/catalyst/"
          fi

          TOTAL=$((FILE_COUNT + WATCH_COUNT + IOS_GEN_COUNT + CATALYST_COUNT))
          if [ "$TOTAL" -eq 0 ]; then
            echo "⚠️  No images to commit"
            exit 0
          fi

          ls -la "$DEST_DIR/" "$DEST_DIR/watch/" "$DEST_DIR/ios-gen/" "$DEST_DIR/catalyst/" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "fuzzed-images/"
          git commit -m "fuzzed-images: ${TIMESTAMP} — ${TOTAL} files (${FILE_COUNT} fuzzer + ${CATALYST_COUNT} catalyst-icc + ${IOS_GEN_COUNT} iOS-gen + ${WATCH_COUNT} watch)

          Generated by xnuimagetools-build-and-test workflow
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          # Pull --rebase in case remote advanced during the workflow run
          git pull --rebase origin main
          git push
          echo "✅ Committed $TOTAL images to $DEST_DIR"

  # ── Job 8: Extract Seeds for CFL Fuzzers ─────────────────
  extract-seeds:
    name: Extract ICC Seeds for CFL
    runs-on: macos-latest
    needs: [generate-images, generate-catalyst-images]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download fuzzed images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fuzzed-images
          path: /tmp/seed-input/sim
        continue-on-error: true

      - name: Download Mac Catalyst images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalyst-images
          path: /tmp/seed-input/catalyst
        continue-on-error: true

      - name: Extract ICC profiles and TIFF seeds
        run: |
          set -euo pipefail
          INPUT_DIR="/tmp/seed-input"
          OUTPUT_DIR="/tmp/extracted-seeds"
          mkdir -p "$OUTPUT_DIR"

          TOTAL=$(find "$INPUT_DIR" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Input files: $TOTAL"

          if [ "$TOTAL" -eq 0 ]; then
            echo "⚠️  No input files for seed extraction"
            exit 0
          fi

          # Run extraction across both sim and catalyst output dirs
          for subdir in sim catalyst; do
            SRC="$INPUT_DIR/$subdir"
            [ -d "$SRC" ] || continue
            COUNT=$(find "$SRC" -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "Processing $subdir: $COUNT files"

            python3 contrib/scripts/extract-icc-seeds.py \
              --input "$SRC" \
              --output "$OUTPUT_DIR" \
              2>&1 || true
          done

          echo ""
          echo "── Extracted Seeds ──"
          ICC_COUNT=$(find "$OUTPUT_DIR/icc" -type f 2>/dev/null | wc -l | tr -d ' ')
          TIFF_COUNT=$(find "$OUTPUT_DIR/tiff" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "ICC profiles: $ICC_COUNT"
          echo "TIFF files:   $TIFF_COUNT"

          echo "## Seed Extraction" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Input files | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ICC profiles extracted | $ICC_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TIFF seeds extracted | $TIFF_COUNT |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload extracted seeds artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cfl-seeds
          path: /tmp/extracted-seeds/
          retention-days: 30
          if-no-files-found: warn
